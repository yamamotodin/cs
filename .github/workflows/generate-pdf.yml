name: Generate PDF

on:
  push:
    paths:
      - 'career_sheet.md'
      - 'career_sheet_2.md'
  workflow_dispatch: {}

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Generate PDFs
        run: |
          md-to-pdf career_sheet.md --launch-options '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}'
          md-to-pdf career_sheet_2.md --launch-options '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}'
          cat career_sheet.md career_sheet_2.md > career_sheet_joint.md
          md-to-pdf career_sheet_joint.md --launch-options '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}'
          rm career_sheet_joint.md

      - name: Commit and push PDFs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add career_sheet.pdf career_sheet_2.pdf career_sheet_joint.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update generated PDFs" -m "🤖 Generated with [Claude Code](https://claude.com/claude-code)" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi